<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vozač - Taksi Udruženje</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { height: 100vh; height: 100dvh; overflow: hidden; margin: 0; }
    #map { height: 100%; width: 100%; }
    #loginScreen, #mainScreen {
      display: none;
      position: fixed;
      top: 60px;
      bottom: 0;
      left: 0;
      right: 0;
    }
    #loginScreen.active {
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 16px;
    }
    .login-card {
      width: min(360px, 92vw); padding: 24px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; text-align: center;
    }
    .login-card h2 { color: var(--accent); margin: 0 0 20px; }

    #mainScreen { height: 100%; }
    #mainScreen.active {
      display: grid;
      grid-template-columns: 1fr 360px;
      grid-template-rows: 100%;
    }
    #mainScreen .map-wrap { position: relative; height: 100%; min-height: 0; overflow: hidden; }
    #mainScreen .side {
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto; border-left: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 12px;
      min-height: 0;
    }
    @media (max-width: 900px) {
      #mainScreen.active {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(40vh, 45%) 1fr;
      }
      #mainScreen .side { border-left: none; border-top: 1px solid var(--border); }
    }

    .status-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; color: white; }
    .status-btn.online { background: var(--green); }
    .status-btn.offline { background: var(--red); }
    .status-ribbon { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--panel2); border-radius: 10px; font-size: 15px; flex-shrink: 0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; }
    .dot.available { background: var(--green); }
    .dot.offline { background: var(--muted); }
    .dot.enroute { background: var(--accent); }
    .dot.busy { background: var(--red); }

    .offer-card { background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 16px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,0.4); } 50% { box-shadow: 0 0 0 10px rgba(250,204,21,0); } }
    .offer-card h3 { color: var(--accent); margin: 0 0 8px; font-size: 18px; }
    .offer-timer { font-size: 13px; color: var(--muted); }
    .offer-actions { display: flex; gap: 10px; margin-top: 14px; }
    .offer-actions button { flex: 1; padding: 13px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; }
    .btn-accept { background: var(--green); color: white; }
    .btn-reject { background: var(--red); color: white; }

    .ride-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow: hidden; }
    .ride-card .nav-btn {
      display: block; width: 100%; margin-top: 10px; padding: 13px;
      background: #3b82f6; color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; text-align: center;
      text-decoration: none;
    }
    .big-stat { text-align: center; padding: 16px; background: var(--panel2); border-radius: 10px; }
    .big-stat .value { font-size: 26px; font-weight: 700; color: var(--green); }
    .big-stat .label { font-size: 12px; color: var(--muted); }
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 2000; background: var(--panel2); border: 1px solid var(--border); border-radius: 0 0 10px 10px; max-height: 200px; overflow-y: auto; }
    .suggestion { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); }
    .suggestion:hover { background: var(--panel); }
    .autocomplete-wrap { position: relative; }

    /* Indikator veze */
    #connBanner {
      display: none; position: fixed; top: 60px; left: 0; right: 0; z-index: 5000;
      background: #ef4444; color: #fff; text-align: center;
      padding: 8px 12px; font-size: 14px; font-weight: 700;
    }
    #connBanner.visible { display: block; }
  </style>
</head>
<body>
  <header class="app-header" style="height:60px">
    <h1>🚖 Vozačka aplikacija</h1>
    <span class="small muted" style="margin-left:auto" id="headerDriver"></span>
  </header>

  <div id="connBanner">⚠️ Veza prekinuta — ponovno povezivanje…</div>

  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-card">
      <h2>Prijava vozača</h2>
      <p class="muted small">Izaberite vaš nalog (vozilo). Nalog vam je kreirao dispečer.</p>
      <div class="field">
        <select id="driverSelect">
          <option value="">— Izaberite vozača/vozilo —</option>
        </select>
      </div>
      <button class="status-btn online" onclick="login()">▶ Uđi</button>
    </div>
  </div>

  <!-- GLAVNI EKRAN -->
  <div id="mainScreen" class="screen">
    <div class="map-wrap">
      <div id="map"></div>
    </div>
    <div class="side">
      <div class="status-ribbon">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Offline</span>
      </div>
      <button class="status-btn offline" id="statusBtn" onclick="toggleStatus()">🔴 OFFLINE — dodirni za online</button>

      <button class="secondary small" style="width:100%" onclick="centerOnMe()">📍 Moj položaj</button>

      <div class="field">
        <label>Traži adresu (opciono)</label>
        <div class="autocomplete-wrap">
          <input type="text" id="addressInput" placeholder="Upišite adresu..." autocomplete="off">
          <div id="addressSuggestions" class="suggestions"></div>
        </div>
      </div>

      <div id="offerArea"></div>
      <div id="currentRideArea"></div>
      <div class="big-stat">
        <div class="value" id="earnings">0 RSD</div>
        <div class="label">Zarađeno danas</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map, myMarker, routeLine = null, pickupMarker = null;
    let drivers = [], rides = [], currentDriver = null, earnings = 0;
    let offerTimer = null;
    let gpsWatchId = null; // ID za watchPosition (kontinuirano GPS praćenje)

    map = L.map('map').setView([44.8125, 20.4612], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);

    const STATUS_RS = {
      pending: 'Čeka dodelu', offering: 'Ponuda poslata', accepted: 'Prihvaćena',
      arrived: 'Stigao', started: 'U toku', completed: 'Završena', cancelled: 'Otkazana'
    };
    const SELF_RS = { offline: 'Offline', available: 'Dostupan', enroute: 'Vozi ka korisniku', busy: 'Zauzet' };

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    // ---- Zvučni signal (WebAudio, bez fajlova) ----
    function beep(times) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < (times || 1); i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880;
          osc.type = 'sine';
          const t0 = ctx.currentTime + i * 0.35;
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
          osc.start(t0); osc.stop(t0 + 0.32);
        }
      } catch (e) { /* zvuk nije kritičan */ }
    }

    // ---- Zarada u localStorage (po datumu — preživi refresh) ----
    function todayKey() { return new Date().toISOString().slice(0, 10); }
    function loadEarnings() {
      try {
        const saved = JSON.parse(localStorage.getItem('taxiEarnings') || '{}');
        earnings = saved.date === todayKey() ? (saved.amount || 0) : 0;
      } catch (e) { earnings = 0; }
      document.getElementById('earnings').textContent = earnings + ' RSD';
    }
    function addEarnings(amount) {
      earnings += amount || 0;
      try {
        localStorage.setItem('taxiEarnings', JSON.stringify({ date: todayKey(), amount: earnings }));
      } catch (e) { /* localStorage nije dostupan */ }
      document.getElementById('earnings').textContent = earnings + ' RSD';
    }

    // ---- Kontinuirano GPS praćenje (stvarna pozicija, ne simulacija) ----
    function startGpsTracking() {
      if (gpsWatchId != null) return; // već radi
      if (!navigator.geolocation) { toast('Geolokacija nije dostupna'); return; }
      gpsWatchId = navigator.geolocation.watchPosition(p => {
        const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (myMarker) myMarker.setLatLng([pos.lat, pos.lng]);
        else myMarker = L.marker([pos.lat, pos.lng]).addTo(map);
        if (currentDriver && currentDriver.status !== 'offline') {
          socket.emit('driver:location', { driverId: currentDriver.id, lat: pos.lat, lng: pos.lng });
        }
      }, () => {
        // tiho — greška se prikazuje samo kod eksplicitnog "Moj položaj"
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
    }

    function stopGpsTracking() {
      if (gpsWatchId != null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
    }

    function renderDriversSelect() {
      const sel = document.getElementById('driverSelect');
      const prev = sel.value;
      sel.innerHTML = '<option value="">— Izaberite vozača/vozilo —</option>' +
        drivers.map(d => `<option value="${d.id}">${d.name} — ${d.vehicle} (${d.plate || 'n/a'})${d.tag ? ' [' + d.tag + ']' : ''}</option>`).join('');
      if (prev) sel.value = prev;
    }

    function login() {
      const id = document.getElementById('driverSelect').value;
      if (!id) return toast('Izaberite vaš nalog');
      currentDriver = drivers.find(d => d.id === id);
      if (!currentDriver) return toast('Nalog nije pronađen');
      socket.emit('driver:register', { driverId: currentDriver.id });
      document.getElementById('headerDriver').textContent = currentDriver.name + ' — ' + currentDriver.vehicle + (currentDriver.tag ? ' [' + currentDriver.tag + ']' : '');
      document.getElementById('loginScreen').classList.remove('active');
      document.getElementById('mainScreen').classList.add('active');
      refreshSelf();
      centerOnMe();
      startGpsTracking(); // kontinuirano praćenje od prijave
      setTimeout(() => map.invalidateSize(), 100);
    }

    function centerOnMe() {
      if (!navigator.geolocation) return toast('Geolokacija nije dostupna');
      navigator.geolocation.getCurrentPosition(p => {
        const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
        map.setView([pos.lat, pos.lng], 16);
        if (myMarker) myMarker.setLatLng([pos.lat, pos.lng]);
        else myMarker = L.marker([pos.lat, pos.lng]).addTo(map);
        if (currentDriver) {
          socket.emit('driver:location', { driverId: currentDriver.id, lat: pos.lat, lng: pos.lng });
        }
      }, () => toast('Nije moguće dobiti lokaciju. Omogućite pristup u podešavanjima.'));
    }

    function refreshSelf() {
      if (!currentDriver) return;
      const d = drivers.find(x => x.id === currentDriver.id);
      if (!d) return;
      currentDriver = d;
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      const btn = document.getElementById('statusBtn');
      dot.className = 'dot ' + (d.status || 'offline');
      txt.textContent = SELF_RS[d.status] || d.status;
      if (d.status === 'available') {
        btn.className = 'status-btn online';
        btn.textContent = '🟢 ONLINE — dodirni za offline';
        btn.disabled = false;
      } else if (d.status === 'offline') {
        btn.className = 'status-btn offline';
        btn.textContent = '🔴 OFFLINE — dodirni za online';
        btn.disabled = false;
      } else {
        btn.className = 'status-btn offline';
        btn.textContent = '⏳ ' + (SELF_RS[d.status] || d.status);
        btn.disabled = true;
      }
      if (d.lat != null && d.lng != null) {
        if (!myMarker) { myMarker = L.marker([d.lat, d.lng]).addTo(map); map.setView([d.lat, d.lng], 14); }
        else myMarker.setLatLng([d.lat, d.lng]);
      }
      renderCurrentRide();
    }

    function getSelfPos() {
      if (currentDriver && currentDriver.lat != null) return { lat: currentDriver.lat, lng: currentDriver.lng };
      return { lat: 44.8125, lng: 20.4612 };
    }

    function toggleStatus() {
      if (!currentDriver) return;
      if (currentDriver.status === 'available') {
        socket.emit('driver:offline', { driverId: currentDriver.id });
      } else if (currentDriver.status === 'offline') {
        navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => {
          socket.emit('driver:online', { driverId: currentDriver.id, lat: p.coords.latitude, lng: p.coords.longitude });
          if (myMarker) myMarker.setLatLng([p.coords.latitude, p.coords.longitude]);
          map.setView([p.coords.latitude, p.coords.longitude], 16);
        }, () => {
          const pos = getSelfPos();
          socket.emit('driver:online', { driverId: currentDriver.id, lat: pos.lat, lng: pos.lng });
        }) : (() => {
          const pos = getSelfPos();
          socket.emit('driver:online', { driverId: currentDriver.id, lat: pos.lat, lng: pos.lng });
        })();
      }
    }

    function setStatus(rideId, status) {
      fetch('/api/rides/' + rideId + '/status', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status })
      }).then(res => {
        if (!res.ok) return res.json().catch(() => ({})).then(e => toast(e.error || 'Greška pri promeni statusa'));
        if (status === 'completed') {
          const r = rides.find(x => x.id === rideId);
          if (r) addEarnings(r.price || 0);
          if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
          if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        }
      });
    }

    function showOffer(ride) {
      const area = document.getElementById('offerArea');
      let remaining = 25;
      area.innerHTML = `
        <div class="offer-card">
          <h3>🚕 Nova vožnja!</h3>
          <div class="small muted">📏 ${ride.distanceKm} km · ⏱ ~${ride.durationMin} min</div>
          <div class="small muted">👥 ${ride.passengers || 1} putnika</div>
          <div class="small mt">📍 ${ride.from.lat.toFixed(4)}, ${ride.from.lng.toFixed(4)}</div>
          <div class="small">🎯 ${ride.to.lat.toFixed(4)}, ${ride.to.lng.toFixed(4)}</div>
          <div class="mt" style="font-size:22px;font-weight:700;color:var(--accent)">${ride.price} RSD</div>
          <div class="offer-timer">Ponuda ističe za <b id="offerCountdown">${remaining}</b>s</div>
          <div class="offer-actions">
            <button class="btn-accept" onclick="acceptOffer('${ride.id}')">✅ Prihvati</button>
            <button class="btn-reject" onclick="rejectOffer('${ride.id}')">✖ Odbij</button>
          </div>
        </div>
      `;
      beep(2); // zvučni signal za novu ponudu
      offerTimer = setInterval(() => {
        remaining--;
        const el = document.getElementById('offerCountdown');
        if (el) el.textContent = remaining;
        if (remaining <= 0) { clearInterval(offerTimer); document.getElementById('offerArea').innerHTML = ''; }
      }, 1000);
    }

    function acceptOffer(rideId) {
      clearInterval(offerTimer);
      fetch('/api/rides/' + rideId + '/accept', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ driverId: currentDriver.id })
      }).then(res => {
        document.getElementById('offerArea').innerHTML = '';
        if (res.ok) {
          toast('Vožnja prihvaćena!');
          drawRouteToPickup();
        } else {
          return res.json().catch(() => ({})).then(e => toast(e.error || 'Vožnja više nije dostupna'));
        }
      });
    }

    function rejectOffer(rideId) {
      clearInterval(offerTimer);
      fetch('/api/rides/' + rideId + '/reject', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ driverId: currentDriver.id })
      });
      document.getElementById('offerArea').innerHTML = '';
    }

    function startNavigation(lat, lng) {
      // Google Maps navigacija - otvara se u Google Maps aplikaciji/browseru
      const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
      window.location.href = url;
    }

    function renderCurrentRide() {
      const area = document.getElementById('currentRideArea');
      if (!currentDriver) return;
      const mine = rides.filter(r => r.driverId === currentDriver.id && !['completed','cancelled'].includes(r.status));
      area.innerHTML = mine.map(r => `
        <div class="ride-card">
          <div class="flex-between">
            <span class="badge ${r.status}">${STATUS_RS[r.status] || r.status}</span>
            <span class="small muted">${r.price} RSD</span>
          </div>
          <div class="small muted mt">👥 ${r.passengers || 1} putnika</div>
          <div class="small">📍 ${r.from.lat.toFixed(4)}, ${r.from.lng.toFixed(4)}</div>
          <div class="small">🎯 ${r.to.lat.toFixed(4)}, ${r.to.lng.toFixed(4)}</div>
          ${r.status === 'accepted' ? `<a class="nav-btn" href="#" onclick="startNavigation(${r.from.lat},${r.from.lng});return false;">🧭 Navigacija do putnika</a>` : ''}
          <div class="flex mt">
            ${r.status === 'accepted' ? `<button class="success small" onclick="setStatus('${r.id}','arrived')">📦 Pokupio putnika</button>` : ''}
            ${r.status === 'arrived' ? `<button class="success small" onclick="setStatus('${r.id}','started')">▶ Počni vožnju</button>` : ''}
            ${r.status === 'started' ? `<button class="success small" onclick="setStatus('${r.id}','completed')">✔ Završi vožnju</button>` : ''}
          </div>
        </div>
      `).join('') || '<p class="muted">Nema aktivne vožnje.</p>';
    }

    function drawRouteToPickup() {
      const mine = rides.find(r => r.driverId === currentDriver.id && r.status === 'accepted');
      if (!mine) return;
      const from = getSelfPos();
      const to = mine.from;
      if (pickupMarker) map.removeLayer(pickupMarker);
      pickupMarker = L.marker([to.lat, to.lng]).addTo(map).bindPopup('Preuzimanje putnika').openPopup();
      fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`)
        .then(r => r.json())
        .then(data => {
          if (data.routes && data.routes[0]) {
            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.polyline(coords, { color: '#3b82f6', weight: 5 }).addTo(map);
            map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
            const dur = Math.round(data.routes[0].duration / 60);
            const dist = (data.routes[0].distance / 1000).toFixed(1);
            toast(`Ruta do putnika: ${dist} km, ~${dur} min`);
          }
        })
        .catch(() => {
          if (routeLine) map.removeLayer(routeLine);
          routeLine = L.polyline([[from.lat, from.lng], [to.lat, to.lng]], { color: '#3b82f6', weight: 5, dashArray: '6,6' }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
        });
    }

    // Autocomplete za pretragu adresa
    const addressInput = document.getElementById('addressInput');
    const addressBox = document.getElementById('addressSuggestions');
    let addrDeb;
    addressInput.addEventListener('input', function() {
      clearTimeout(addrDeb);
      const q = addressInput.value.trim();
      if (q.length < 3) { addressBox.innerHTML = ''; return; }
      addrDeb = setTimeout(() => {
        fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=sr&q=' + encodeURIComponent(q), {
          headers: { 'Accept': 'application/json' }
        })
        .then(r => r.json())
        .then(data => {
          addressBox.innerHTML = data.map(item => `
            <div class="suggestion" onclick="gotoAddress(${item.lat}, ${item.lon})">
              ${item.display_name}
            </div>
          `).join('');
        })
        .catch(() => {});
      }, 350);
    });

    function gotoAddress(lat, lon) {
      addressBox.innerHTML = '';
      map.setView([lat, lon], 16);
    }

    socket.on('init', (data) => { drivers = data.drivers; rides = data.rides; renderDriversSelect(); });
    socket.on('drivers:updated', (data) => { drivers = data; renderDriversSelect(); refreshSelf(); });
    socket.on('rides:updated', (data) => { rides = data; renderCurrentRide(); });
    socket.on('ride:offer', (ride) => { showOffer(ride); });
    socket.on('ride:offer_expired', () => { document.getElementById('offerArea').innerHTML = ''; });
    socket.on('ride:status', ({ rideId, status }) => {
      if (status === 'accepted') { renderCurrentRide(); drawRouteToPickup(); }
      else renderCurrentRide();
    });

    // ---- Reconnect: indikator + automatska ponovna registracija vozača ----
    socket.on('connect', () => {
      document.getElementById('connBanner').classList.remove('visible');
      if (currentDriver) {
        // Ponovo registruj socket i vrati status (ako je bio online)
        socket.emit('driver:register', { driverId: currentDriver.id });
        if (currentDriver.status !== 'offline') {
          const pos = getSelfPos();
          socket.emit('driver:online', { driverId: currentDriver.id, lat: pos.lat, lng: pos.lng });
          toast('Veza uspostavljena');
        }
      }
    });
    socket.on('disconnect', () => {
      document.getElementById('connBanner').classList.add('visible');
    });

    loadEarnings();
    window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
