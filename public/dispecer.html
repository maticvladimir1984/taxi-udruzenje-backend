<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispečer - Taksi Udruženje</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      height: calc(100vh - 60px);
      gap: 0;
    }
    .col { padding: 16px; overflow-y: auto; border-right: 1px solid var(--border); }
    .col:last-child { border-right: none; border-left: 1px solid var(--border); }
    #map { height: 100%; }
    .driver-item, .ride-item {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--panel2);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 50% auto; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>🚕 Dispečerska Centrala</h1>
    <span class="small muted" style="margin-left:auto">Interni operativni sistem udruženja</span>
  </header>

  <div class="layout">
    <!-- Leva kolona: vozači -->
    <div class="col">
      <h2 style="margin:0 0 8px 0">Dodaj vozača</h2>
      <div class="field">
        <input type="text" id="driverName" placeholder="Ime vozača">
      </div>
      <div class="field">
        <input type="text" id="driverVehicle" placeholder="Model vozila (npr. Škoda Octavia)">
      </div>
      <div class="field">
        <input type="text" id="driverPlate" placeholder="Registracija (npr. BG-123-AB)">
      </div>
      <div class="field">
        <input type="text" id="driverPhone" placeholder="Telefon">
      </div>
      <button class="success" style="width:100%" onclick="addDriver()">+ Dodaj vozača</button>
      <hr style="border-color:var(--border);margin:16px 0">
      <h2 style="margin:0 0 8px 0">Vozači u floti</h2>
      <div id="driversList"></div>
    </div>

    <!-- Srednja kolona: mapa -->
    <div class="col" style="padding:0">
      <div id="map"></div>
    </div>

    <!-- Desna kolona: vožnje -->
    <div class="col">
      <h2 style="margin:0 0 8px 0">Aktivne vožnje</h2>
      <div id="ridesList"></div>

      <h2 style="margin:16px 0 8px 0">Tarifa</h2>
      <div class="card" style="padding:10px">
        <label>Start (RSD)</label>
        <input type="number" id="baseFare" onchange="updateSettings()">
        <label>Po km (RSD)</label>
        <input type="number" id="pricePerKm" onchange="updateSettings()">
        <label>Po min (RSD)</label>
        <input type="number" id="pricePerMinute" onchange="updateSettings()">
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map, driverMarkers = {}, passengerMarkers = {};
    let drivers = [], rides = [], settings = {};

    // Mapa (centar: Beograd)
    map = L.map('map').setView([44.8125, 20.4612], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    const STATUS_RS = {
      pending: 'Na čekanju', offering: 'Ponuda poslata', accepted: 'Prihvaćena',
      arrived: 'Stigao', started: 'U toku', completed: 'Završena', cancelled: 'Otkazana'
    };
    const DRIVER_STATUS_RS = { offline: 'Offline', available: 'Dostupan', enroute: 'Vozi ka korisniku', busy: 'Zauzet' };

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function driverColor(status) {
      if (status === 'available') return '#22c55e';
      if (status === 'enroute') return '#f59e0b';
      if (status === 'busy') return '#ef4444';
      return '#64748b'; // offline
    }

    function renderDrivers() {
      const el = document.getElementById('driversList');
      el.innerHTML = drivers.map(d => `
        <div class="driver-item">
          <div class="flex-between">
            <strong>${d.name}</strong>
            <span class="badge ${d.status}">${DRIVER_STATUS_RS[d.status] || d.status}</span>
          </div>
          <div class="small muted">${d.vehicle} · ${d.plate || 'n/a'}</div>
          <div class="small muted">📞 ${d.phone || '—'}</div>
          <div class="mt flex">
            <button class="danger small" onclick="deleteDriver('${d.id}')">Obriši</button>
          </div>
        </div>
      `).join('') || '<p class="muted">Nema vozača. Dodajte prvog.</p>';

      // Ažuriraj markere vozača
      const ids = new Set(drivers.map(d => d.id));
      for (const id in driverMarkers) {
        if (!ids.has(id)) { map.removeLayer(driverMarkers[id]); delete driverMarkers[id]; }
      }
      drivers.forEach(d => {
        if (d.lat != null && d.lng != null) {
          const icon = L.divIcon({
            className: '',
            html: `<div style="background:${driverColor(d.status)};width:16px;height:16px;border-radius:50%;border:2px solid white;"></div>`,
            iconSize: [16,16], iconAnchor: [8,8]
          });
          if (driverMarkers[d.id]) {
            driverMarkers[d.id].setLatLng([d.lat, d.lng]);
            driverMarkers[d.id].setIcon(icon);
          } else {
            driverMarkers[d.id] = L.marker([d.lat, d.lng], { icon }).addTo(map)
              .bindPopup(`<b>${d.name}</b><br>${d.vehicle}<br>${d.plate || ''}<br>${DRIVER_STATUS_RS[d.status]}`);
          }
        }
      });
    }

    function renderRides() {
      const el = document.getElementById('ridesList');
      const active = rides.filter(r => !['completed', 'cancelled'].includes(r.status));
      el.innerHTML = active.map(r => {
        const driver = drivers.find(d => d.id === r.driverId);
        const waiting = ['pending', 'offering'].includes(r.status);
        return `
          <div class="ride-item">
            <div class="flex-between">
              <span class="badge ${r.status}">${STATUS_RS[r.status]}</span>
              <span class="small">${r.id}</span>
            </div>
            <div class="small muted mt">👥 ${r.passengers || 1} putnika · ${r.price || 0} RSD</div>
            <div class="small muted">📍 ${(r.from?.lat ?? 0).toFixed(4)}, ${(r.from?.lng ?? 0).toFixed(4)}</div>
            <div class="small muted">🎯 ${(r.to?.lat ?? 0).toFixed(4)}, ${(r.to?.lng ?? 0).toFixed(4)}</div>
            ${driver ? `<div class="small">Vozač: <b>${driver.name}</b> (${driver.vehicle})</div>` : ''}
            <div class="mt">
              ${waiting ? `<select id="driverSelect-${r.id}" style="margin-bottom:6px">
                <option value="">— Izaberi vozača —</option>
                ${drivers.filter(d => d.status === 'available' || d.status === 'offline').map(d => `<option value="${d.id}">${d.name} (${d.vehicle})</option>`).join('')}
              </select>
              <button class="warning small" style="width:100%;background:#f59e0b;color:#111" onclick="assignRide('${r.id}')">Dodeli vozača (ručno)</button>` : ''}
            </div>
          </div>
        `;
      }).join('') || '<p class="muted">Nema aktivnih vožnji.</p>';

      // Markeri za korisnike koji čekaju (nije dodeljen vozač)
      const waitingIds = new Set(active.filter(r => !r.driverId).map(r => r.id));
      for (const id in passengerMarkers) {
        if (!waitingIds.has(id)) { map.removeLayer(passengerMarkers[id]); delete passengerMarkers[id]; }
      }
      active.filter(r => !r.driverId).forEach(r => {
        if (r.from && r.from.lat != null) {
          const icon = L.divIcon({
            className: '',
            html: `<div style="background:#3b82f6;width:14px;height:14px;border-radius:50%;border:2px solid white;"></div>`,
            iconSize: [14,14], iconAnchor: [7,7]
          });
          if (passengerMarkers[r.id]) {
            passengerMarkers[r.id].setLatLng([r.from.lat, r.from.lng]);
          } else {
            passengerMarkers[r.id] = L.marker([r.from.lat, r.from.lng], { icon }).addTo(map)
              .bindPopup(`<b>Korisnik čeka</b><br>${r.passenger || ''}<br>👥 ${r.passengers || 1} · ${r.price || 0} RSD`);
          }
        }
      });
    }

    function renderSettings() {
      document.getElementById('baseFare').value = settings.baseFare || 200;
      document.getElementById('pricePerKm').value = settings.pricePerKm || 80;
      document.getElementById('pricePerMinute').value = settings.pricePerMinute || 15;
    }

    async function addDriver() {
      const name = document.getElementById('driverName').value.trim();
      const vehicle = document.getElementById('driverVehicle').value.trim();
      const plate = document.getElementById('driverPlate').value.trim();
      const phone = document.getElementById('driverPhone').value.trim();
      if (!name) return toast('Unesite ime vozača');
      await fetch('/api/drivers', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, vehicle, plate, phone })
      });
      document.getElementById('driverName').value = '';
      document.getElementById('driverVehicle').value = '';
      document.getElementById('driverPlate').value = '';
      document.getElementById('driverPhone').value = '';
      toast('Vozač dodat');
    }

    async function deleteDriver(id) {
      await fetch('/api/drivers/' + id, { method: 'DELETE' });
      toast('Vozač obrisan');
    }

    async function assignRide(rideId) {
      const sel = document.getElementById('driverSelect-' + rideId);
      if (!sel.value) return toast('Izaberite vozača');
      await fetch('/api/rides/' + rideId + '/assign', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ driverId: sel.value })
      });
      toast('Vozač dodeljen');
    }

    async function updateSettings() {
      const body = {
        baseFare: +document.getElementById('baseFare').value,
        pricePerKm: +document.getElementById('pricePerKm').value,
        pricePerMinute: +document.getElementById('pricePerMinute').value,
      };
      await fetch('/api/settings', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      toast('Tarifa ažurirana');
    }

    socket.on('init', (data) => {
      drivers = data.drivers; rides = data.rides; settings = data.settings;
      renderDrivers(); renderRides(); renderSettings();
    });
    socket.on('drivers:updated', (data) => { drivers = data; renderDrivers(); renderRides(); });
    socket.on('rides:updated', (data) => { rides = data; renderRides(); });
    socket.on('ride:new', () => toast('🔔 Nova vožnja stigla!'));

    window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
