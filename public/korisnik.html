<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korisnik - Naruči vožnju</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { height: 100vh; height: 100dvh; overflow: hidden; }
    #map { height: 100%; }
    .layout { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 60px); height: calc(100dvh - 60px); }
    .map-col { height: 100%; min-height: 0; }
    .side { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; border-left: 1px solid var(--border); min-height: 0; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
      .side { border-left: none; border-top: 1px solid var(--border); }
    }
    .step { display: none; }
    .step.active { display: block; }
    .quick-loc { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .quick-loc button { padding: 6px 12px; font-size: 13px; }
    .autocomplete-wrap { position: relative; }
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 2000;
      background: var(--panel2); border: 1px solid var(--border); border-radius: 0 0 10px 10px;
      max-height: 240px; overflow-y: auto;
    }
    .suggestion {
      padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border);
    }
    .suggestion:hover { background: var(--panel); }
    .suggestion .t { color: var(--text); }
    .suggestion .s { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header class="app-header" style="height:60px">
    <h1>🚕 Naruči vožnju</h1>
  </header>

  <div class="layout">
    <div class="map-col">
      <div id="map"></div>
    </div>

    <div class="side">
      <!-- KORAK 1: Unos -->
      <div id="step1" class="step active">
        <div class="card">
          <h2>Gde putujete?</h2>

          <div class="field">
            <label>Vaše ime</label>
            <input type="text" id="passengerName" placeholder="npr. Marko Marković">
          </div>

          <div class="field">
            <label>Broj osoba</label>
            <select id="passengerCount">
              <option value="1">1 osoba</option>
              <option value="2">2 osobe</option>
              <option value="3">3 osobe</option>
              <option value="4">4 osobe</option>
              <option value="5">5 osoba</option>
              <option value="6">6 osoba</option>
            </select>
          </div>

          <div class="field">
            <label>Polazak</label>
            <div class="quick-loc">
              <button class="secondary small" onclick="useMyLocation('from')">📍 Moja lokacija</button>
              <button class="secondary small" onclick="pickMode='from'; toast('Kliknite kartu za polazak')">🗺 Na karti</button>
              <button class="secondary small" onclick="enterCoords('from')">🧭 Koordinate</button>
            </div>
            <div class="autocomplete-wrap">
              <input type="text" id="fromInput" placeholder="Upišite adresu..." autocomplete="off">
              <div id="fromSuggestions" class="suggestions"></div>
            </div>
          </div>

          <div class="field">
            <label>Odredište</label>
            <div class="quick-loc">
              <button class="secondary small" onclick="pickMode='to'; toast('Kliknite kartu za odredište')">🗺 Na karti</button>
              <button class="secondary small" onclick="enterCoords('to')">🧭 Koordinate</button>
            </div>
            <div class="autocomplete-wrap">
              <input type="text" id="toInput" placeholder="Upišite adresu..." autocomplete="off">
              <div id="toSuggestions" class="suggestions"></div>
            </div>
          </div>

          <button style="width:100%" onclick="estimate()">💰 Izračunaj cenu</button>
          <div id="estimateResult" class="mt"></div>
        </div>
      </div>

      <!-- KORAK 2: Potvrda -->
      <div id="step2" class="step">
        <div class="card">
          <h2>Potvrdite narudžbinu</h2>
          <div id="orderSummary"></div>
          <button class="success" style="width:100%" onclick="orderRide()">✅ Potvrdi i naruči</button>
          <button class="secondary" style="width:100%" onclick="step(1)">← Nazad</button>
        </div>
      </div>

      <!-- KORAK 3: Praćenje -->
      <div id="step3" class="step">
        <div class="card">
          <h2>Vožnja naručena</h2>
          <p class="muted">Status: <span id="rideStatus" class="badge pending">Na čekanju</span></p>
          <div id="trackingInfo"></div>
          <div id="actionArea"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let map, fromMarker, toMarker, driverMarker;
    let pickMode = null; // 'from' | 'to'
    let from = null, to = null, estimateData = null, currentRide = null;
    let drivers = [], rides = [];
    let fromDebounce, toDebounce;
    let currentEta = null; // { etaMinutes, distanceKm }

    map = L.map('map').setView([44.8125, 20.4612], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);

    map.on('click', function(e) {
      if (!pickMode) return;
      const pos = { lat: e.latlng.lat, lng: e.latlng.lng };
      if (pickMode === 'from') {
        setFrom(pos);
      } else if (pickMode === 'to') {
        setTo(pos);
      }
      pickMode = null;
    });

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function setFrom(pos) {
      from = pos;
      document.getElementById('fromInput').value = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);
      if (fromMarker) map.removeLayer(fromMarker);
      fromMarker = L.marker([pos.lat, pos.lng]).addTo(map).bindPopup('Polazak').openPopup();
      map.setView([pos.lat, pos.lng], 15);
    }

    function setTo(pos) {
      to = pos;
      document.getElementById('toInput').value = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);
      if (toMarker) map.removeLayer(toMarker);
      toMarker = L.marker([pos.lat, pos.lng]).addTo(map).bindPopup('Odredište').openPopup();
      if (from) map.fitBounds([[from.lat, from.lng], [to.lat, to.lng]], { padding: [30, 30] });
      else map.setView([pos.lat, pos.lng], 15);
    }

    function useMyLocation(which) {
      if (!navigator.geolocation) return toast('Geolokacija nije dostupna');
      navigator.geolocation.getCurrentPosition(p => {
        const pos = { lat: p.coords.latitude, lng: p.coords.longitude };
        if (which === 'from') setFrom(pos); else setTo(pos);
      }, () => toast('Nije moguće dobiti lokaciju. Omogućite pristup lokaciji.'));
    }

    function enterCoords(which) {
      const val = prompt('Unesite koordinate (lat, lng)\nPrimer: 44.8125, 20.4612', '');
      if (!val) return;
      const parts = val.split(',').map(s => parseFloat(s.trim()));
      if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return toast('Neispravne koordinate');
      const pos = { lat: parts[0], lng: parts[1] };
      if (which === 'from') setFrom(pos); else setTo(pos);
    }

    // Autocomplete preko Nominatim (OpenStreetMap) - besplatan
    function autocomplete(inputId, suggId, cb) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(suggId);
      let deb;
      input.addEventListener('input', function() {
        clearTimeout(deb);
        const q = input.value.trim();
        if (q.length < 3) { box.innerHTML = ''; return; }
        deb = setTimeout(() => {
          fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=sr&q=' + encodeURIComponent(q), {
            headers: { 'Accept': 'application/json' }
          })
          .then(r => r.json())
          .then(data => {
            box.innerHTML = data.map(item => `
              <div class="suggestion" onclick="selectSuggestion('${suggId}', ${item.lat}, ${item.lon}, '${inputId}', '${inputId === 'fromInput' ? 'from' : 'to'}')">
                <div class="t">${item.display_name}</div>
              </div>
            `).join('');
          })
          .catch(() => {});
        }, 350);
      });
    }

    function selectSuggestion(suggId, lat, lon, inputId, which) {
      document.getElementById(suggId).innerHTML = '';
      const pos = { lat: parseFloat(lat), lng: parseFloat(lon) };
      if (which === 'from') setFrom(pos); else setTo(pos);
      document.getElementById(inputId).value = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);
    }

    function step(n) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + n).classList.add('active');
    }

    async function estimate() {
      if (!from || !to) return toast('Postavite polazak i odredište');
      const res = await fetch('/api/rides/estimate', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ from, to })
      });
      estimateData = await res.json();
      document.getElementById('estimateResult').innerHTML = `
        <div class="card" style="background:var(--bg);margin-top:10px">
          <p>📏 Udaljenost: <b>${estimateData.distanceKm} km</b></p>
          <p>⏱ Trajanje: <b>~${estimateData.durationMin} min</b></p>
          <h2 style="color:var(--accent);margin:10px 0">${estimateData.price} RSD</h2>
        </div>
      `;
      step(2);
      renderOrderSummary();
    }

    function renderOrderSummary() {
      const name = document.getElementById('passengerName').value.trim() || 'Anoniman';
      const count = document.getElementById('passengerCount').value;
      document.getElementById('orderSummary').innerHTML = `
        <p>👤 <b>${name}</b> · 👥 ${count}</p>
        <p>📍 ${from.lat.toFixed(4)}, ${from.lng.toFixed(4)}</p>
        <p>🎯 ${to.lat.toFixed(4)}, ${to.lng.toFixed(4)}</p>
        <p>💰 <b>${estimateData.price} RSD</b></p>
        <p>📏 ${estimateData.distanceKm} km, ~${estimateData.durationMin} min</p>
      `;
    }

    async function orderRide() {
      const name = document.getElementById('passengerName').value.trim() || 'Anoniman';
      const count = parseInt(document.getElementById('passengerCount').value, 10);
      const res = await fetch('/api/rides', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          passenger: name,
          passengers: count,
          from, to,
          distanceKm: estimateData.distanceKm,
          durationMin: estimateData.durationMin,
          price: estimateData.price
        })
      });
      currentRide = await res.json();
      step(3);
      renderTracking();
    }

    function renderTracking() {
      if (!currentRide) return;
      const s = currentRide.status;
      const statusMap = {
        pending: 'Na čekanju', offering: 'Šaljemo ponude vozačima...', accepted: 'Vozač prihvaćen!',
        arrived: 'Vozač je stigao', started: 'U toku', completed: 'Završena', cancelled: 'Otkazana'
      };
      document.getElementById('rideStatus').textContent = statusMap[s] || s;
      document.getElementById('rideStatus').className = 'badge ' + s;

      const driver = drivers.find(d => d.id === currentRide.driverId);
      const etaHtml = currentEta ? `
        <div class="card" style="background:var(--bg);margin-top:10px;border-color:var(--accent)">
          <h3 style="color:var(--accent)">🚕 ETA do dolaska</h3>
          <p>⏱ <b>~${currentEta.etaMinutes} min</b></p>
          <p>📏 ${currentEta.distanceKm} km od vas</p>
        </div>
      ` : '';
      document.getElementById('trackingInfo').innerHTML = (driver ? `
        <div class="card" style="background:var(--bg);margin-top:10px">
          <h3>Vaš vozač</h3>
          <p>👤 <b>${driver.name}</b></p>
          <p>🚗 ${driver.vehicle} · ${driver.plate || ''}</p>
          <p>📞 ${driver.phone || 'Nema'}</p>
        </div>
      ` : '<p class="muted mt">Čekamo vozača da prihvati vožnju...</p>') + etaHtml;

      if (driver && driver.lat != null && driver.lng != null) {
        if (driverMarker) map.removeLayer(driverMarker);
        driverMarker = L.marker([driver.lat, driver.lng]).addTo(map).bindPopup('Vozač: ' + driver.name).openPopup();
      }
      renderActions();
    }

    let cancelTimer = null;

    function stopCancelTimer() {
      if (cancelTimer) { clearInterval(cancelTimer); cancelTimer = null; }
    }

    function renderActions() {
      const area = document.getElementById('actionArea');
      if (!area) return;
      if (!currentRide) { area.innerHTML = ''; stopCancelTimer(); return; }
      const s = currentRide.status;
      if (['completed', 'cancelled'].includes(s)) {
        stopCancelTimer();
        area.innerHTML = s === 'completed'
          ? '<p style="width:100%;padding:10px;text-align:center;color:var(--green);font-weight:700">✅ Vožnja je završena. Hvala!</p>'
          : '<p class="muted" style="width:100%;padding:10px;text-align:center">Vožnja je otkazana.</p>';
        return;
      }

      const created = new Date(currentRide.createdAt).getTime();
      const TWO_MIN = 2 * 60 * 1000;
      const elapsed = Date.now() - created;
      let html = '';

      if (elapsed <= TWO_MIN) {
        const remaining = Math.max(0, Math.ceil((TWO_MIN - elapsed) / 1000));
        const mm = Math.floor(remaining / 60);
        const ss = remaining % 60;
        html += `<div class="card" style="background:var(--bg);margin-top:10px;border-color:var(--accent)">
          <p class="small muted">Besplatno otkazivanje još: <b id="cancelCountdown">${mm}:${String(ss).padStart(2, '0')}</b></p>
          <button class="danger" style="width:100%" onclick="cancelRide()">✖ Otkaži vožnju</button>
        </div>`;
        stopCancelTimer();
        cancelTimer = setInterval(() => {
          const rem = Math.max(0, Math.ceil((TWO_MIN - (Date.now() - created)) / 1000));
          const el2 = document.getElementById('cancelCountdown');
          if (el2) {
            el2.textContent = Math.floor(rem / 60) + ':' + String(rem % 60).padStart(2, '0');
          }
          if (rem <= 0) { stopCancelTimer(); renderActions(); }
        }, 1000);
      }

      if (s === 'started') {
        html += `<button class="success" style="width:100%;margin-top:10px" onclick="completeRide()">✔ Potvrdi završetak vožnje</button>`;
      }

      area.innerHTML = html;
    }

    async function cancelRide() {
      if (!currentRide) return;
      const res = await fetch('/api/rides/' + currentRide.id + '/cancel', { method: 'POST' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast(err.error || 'Otkazivanje nije moguće');
        renderActions();
        return;
      }
      toast('Vožnja otkazana');
    }

    async function completeRide() {
      if (!currentRide) return;
      const res = await fetch('/api/rides/' + currentRide.id + '/complete', { method: 'POST' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast(err.error || 'Potvrda nije moguća');
        return;
      }
      toast('Hvala! Vožnja je završena.');
    }

    socket.on('init', (data) => { drivers = data.drivers; rides = data.rides; });
    socket.on('drivers:updated', (data) => { drivers = data; if (currentRide) renderTracking(); });
    socket.on('ride:eta', (data) => {
      if (currentRide && data.rideId === currentRide.id) {
        currentEta = { etaMinutes: data.etaMinutes, distanceKm: data.distanceKm };
        renderTracking();
      }
    });
    socket.on('rides:updated', (data) => {
      rides = data;
      if (currentRide) {
        const updated = rides.find(r => r.id === currentRide.id);
        if (updated) { currentRide = updated; renderTracking(); }
      }
    });

    window.addEventListener('resize', () => map.invalidateSize());

    // Inicijalizuj autocomplete za oba polja
    autocomplete('fromInput', 'fromSuggestions');
    autocomplete('toInput', 'toSuggestions');
  </script>
</body>
</html>
